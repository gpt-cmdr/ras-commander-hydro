site_name: RAS Commander Hydro
site_url: https://rascommander.info/hydro/
site_description: User guide for importing HEC-RAS geometry, results, and terrain into ArcGIS Pro with the RAS Commander Arc Hydro Tools.
repo_url: https://github.com/gpt-cmdr/ras-commander-hydro
repo_name: gpt-cmdr/ras-commander-hydro
docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: blue
      accent: light blue
      toggle: {icon: material/brightness-4, name: Switch to light mode}
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/clb-branding.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quick-start.md
  - Choose a tool: features.md
  - Tool guides:
      - Load 1D geometry: tools/load-1d-geometry.md
      - Load 2D geometry: tools/load-2d-geometry.md
      - Load 2D results: tools/load-2d-results.md
      - Load terrain: tools/load-terrain.md
      - Organize a project: tools/organize-project.md
  - Reference:
      - Outputs and naming: reference/outputs.md
      - Validation checklist: reference/validation.md
      - Troubleshooting: troubleshooting.md
