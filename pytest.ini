[pytest]
testpaths = tests
pythonpath = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    tier1: Tier 1 tests using local testdata/ (always available)
    tier2: Tier 2 tests using production models on L:\ drive
    requires_arcpy: Tests that require arcpy (ArcGIS Pro Python)
    slow: Tests that take more than 30 seconds
    unicode: Tests specifically targeting unicode/encoding handling

addopts = -v --tb=short
